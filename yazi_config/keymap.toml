# Extra keybindings, for plugins and for tips from the yazi docs.
#
# These are prepended, so they take precedence over yazi's own defaults.
# Check yazi's default keymap before adding one, or you will shadow
# something without any warning.

# chmod: change the mode of the selected files.
# "c m" is not bound by default, so nothing is shadowed.
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# vcs-files: list the files changed in git.
# Note that "g c" is "Go to ~/.config" in yazi's defaults, and this replaces
# it. Rebind that elsewhere here if you still want it.
[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"

# Jump to the root of the current git repository.
# From https://yazi-rs.github.io/docs/tips/#cd-to-git-root
# "g r" is not bound by default, so nothing is shadowed.
[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Cd to the git repository root"
